# pcbmotorgen workspace — routing/simulation/dfm/export sub-crates + Tauri app.
#
# Crate division:
#   - pcbmotorgen-routing   : traces & generation, pattern plugins, strict wire
#                              -contract validation (leaf).
#   - pcbmotorgen-simulation: all physics simulations (depends on routing).
#   - pcbmotorgen-dfm       : manufacturability downstream of routing —
#                              DesignRules sizing authority + DRC interference
#                              diagnostics (depends on routing).
#   - pcbmotorgen-export    : exporters for routing's generic geometry —
#                              KiCad 10 IPC adapter (board items, commits,
#                              diagnostics, preview) + DXF R12 ASCII exporter
#                              (LINE/ARC/CIRCLE). Depends on routing + dfm.
#   - pcbmotorgen (app/src-tauri): parent orchestrator — config, UI, Tauri IPC,
#                              consumes the sub-crates.
[workspace]
resolver = "2"
members = [
    "crates/pcbmotorgen-routing",
    "crates/pcbmotorgen-simulation",
    "crates/pcbmotorgen-dfm",
    "crates/pcbmotorgen-export",
    "app/desktop/src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# Internal
pcbmotorgen-routing = { path = "crates/pcbmotorgen-routing" }
pcbmotorgen-simulation = { path = "crates/pcbmotorgen-simulation" }
pcbmotorgen-dfm = { path = "crates/pcbmotorgen-dfm" }
pcbmotorgen-export = { path = "crates/pcbmotorgen-export" }
# Physics / math
magba = "=0.7.2"
nalgebra = "0.34"
rayon = "1.10"
# Serialization (shared across crates)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
